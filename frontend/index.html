<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP SUITE - Business Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var userProfileRaw = localStorage.getItem('crm_user_profile');
          var userId = '';
          if (userProfileRaw) {
            var parsed = JSON.parse(userProfileRaw);
            userId = parsed.id || parsed.empCode || '';
          }
          var stored = (userId && localStorage.getItem('crm_theme_' + userId)) || localStorage.getItem('crm_theme') || 'light';
          if (stored !== 'light' && stored !== 'dark' && stored !== 'system') {
            stored = 'light';
          }
          var resolved = stored;
          if (stored === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          root.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8faff] text-slate-900 dark:bg-[#090D16] dark:text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: crm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HRMS
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: crm_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: HRMS
      DB_PORT: 5432
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: crm_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

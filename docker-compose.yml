version: '3.8'

services:
  # HRMS PostgreSQL Database (Friend 2 — Employees, Payroll, Attendance)
  postgres_hrms:
    image: postgres:18-alpine
    container_name: hrms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HRMS
    ports:
      - "5432:5432"
    volumes:
      - pgdata_hrms:/var/lib/postgresql/data

  # CRM PostgreSQL Database (Friend 1 — Leads, Customers, Sales)
  postgres_crm:
    image: postgres:18-alpine
    container_name: crm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "5433:5432"
    volumes:
      - pgdata_crm:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: crm_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # HRMS DB
      DB_HOST: postgres_hrms
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: HRMS
      DB_PORT: 5432
      # CRM DB
      CRM_DB_HOST: postgres_crm
      CRM_DB_USER: postgres
      CRM_DB_PASSWORD: postgres
      CRM_DB_NAME: crm
      CRM_DB_PORT: 5432
    depends_on:
      - postgres_hrms
      - postgres_crm

  frontend:
    build:
      context: ./frontend
    container_name: crm_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata_hrms:
  pgdata_crm:

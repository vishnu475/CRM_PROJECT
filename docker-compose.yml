version: '3.8'

services:
  # HRMS PostgreSQL Database (Friend 2 — Employees, Payroll, Attendance)
  postgres_hrms:
    image: postgres:16-alpine
    container_name: hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HRMS
    ports:
      - "5434:5432"
    volumes:
      - pgdata_hrms:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HRMS"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CRM PostgreSQL Database (Friend 1 — Leads, Customers, Sales)
  postgres_crm:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "5435:5432"
    volumes:
      - pgdata_crm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      JWT_SECRET: erp_crm_hrms_jwt_secret_2025
      # HRMS DB
      DB_HOST: postgres_hrms
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: HRMS
      DB_PORT: 5432
      # CRM DB
      CRM_DB_HOST: postgres_crm
      CRM_DB_USER: postgres
      CRM_DB_PASSWORD: postgres
      CRM_DB_NAME: crm
      CRM_DB_PORT: 5432
    depends_on:
      postgres_hrms:
        condition: service_healthy
      postgres_crm:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata_hrms:
  pgdata_crm:
  uploads_data:
